[project]
name = "myoacross-hsmr-tools"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "lib", "skel", "detectron2", "chumpy",
    "braceexpand", "colorlog", "einops", "hydra-core>=1.3.2,<1.4",
    "imageio[ffmpeg]", "ipdb", "matplotlib", "numpy>=1.26,<2",
    "omegaconf>=2.3,<2.4", "opencv-python", "pyrender", "pytorch-lightning",
    "requests", "rich", "setuptools==75.3.4", "smplx", "timm",
    "torch>=2.8,<2.10", "torchvision", "tqdm", "trimesh", "webdataset", "wis3d", "yacs",
    "scipy",
]

[tool.uv]
package = false

[tool.uv.sources]
lib = { git = "https://github.com/IsshikiHugh/HSMR.git", rev = "88486dc14329456615a9eef2f8e362122bc72589" }
skel = { git = "https://github.com/MarilynKeller/SKEL.git", rev = "c32cf16581295bff19399379efe5b776d707cd95" }
detectron2 = { git = "https://github.com/facebookresearch/detectron2.git", rev = "1e3e13bbf607b54f62205c4c33922521822fb298" }
chumpy = { git = "https://github.com/MarilynKeller/chumpy.git", rev = "0ed87ece06b03efb2d5b7d876acb8218737d7fad" }

[tool.uv.extra-build-dependencies]
detectron2 = [{ requirement = "torch", match-runtime = true }, "setuptools"]
chumpy = ["pip"]
